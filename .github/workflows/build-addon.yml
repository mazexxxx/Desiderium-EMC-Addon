name: Build Forge addon

on:
  push:
    branches:
      - emc-addon-dev
  pull_request:
    branches:
      - emc-addon-dev
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: forge-mdk
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build mod
        run: ./gradlew --no-daemon clean build

      - name: Upload mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: DesideriumEMCAddon
          path: forge-mdk/build/libs/*.jar
          if-no-files-found: error
          retention-days: 14
